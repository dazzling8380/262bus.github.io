<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="evBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="evWindowGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="evWindshieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#0F172A" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="mtcGreenWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="mtcBlueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="tireRubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="rimAlloy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <filter id="ledGlow262" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="busShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#busShadow)">
    <!-- Road ground shadow -->
    <ellipse cx="500" cy="305" rx="465" ry="18" fill="#000000" opacity="0.4" filter="blur(8px)"/>

    <!-- Roof Battery Pods & AC System (Electric Bus Spec) -->
    <rect x="230" y="36" width="260" height="22" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <text x="360" y="52" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" letter-spacing="1">⚡ ELECTRIC BUS BATTERY PACK</text>
    
    <rect x="520" y="40" width="180" height="18" rx="5" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <line x1="540" y1="46" x2="680" y2="46" stroke="#64748B" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="540" y1="52" x2="680" y2="52" stroke="#64748B" stroke-width="2" stroke-dasharray="6 3"/>

    <!-- Main Aerodynamic Body Shell -->
    <path d="M 945 270 
             L 945 98 
             C 945 65 918 50 870 50 
             L 95 50 
             C 65 50 50 65 50 95 
             L 50 270 
             C 50 282 62 285 75 285 
             L 160 285 
             A 65 65 0 0 1 290 285 
             L 690 285 
             A 65 65 0 0 1 820 285 
             L 915 285 
             C 935 285 945 280 945 270 Z" 
          fill="url(#evBodyGrad)" stroke="#475569" stroke-width="2"/>

    <!-- Front Nose Streamline (Right Side = Front of Bus) -->
    <path d="M 870 54 
             L 936 96 
             C 944 118 944 175 944 190 
             L 865 190 
             L 865 54 Z" 
          fill="url(#evWindshieldGrad)" stroke="#0F172A" stroke-width="2"/>

    <!-- Large Panoramic Tinted Side Windows -->
    <rect x="75" y="65" width="780" height="120" rx="8" fill="url(#evWindowGlass)" stroke="#0F172A" stroke-width="2.5"/>

    <!-- Window Pillars & Structural Ribs -->
    <line x1="175" y1="65" x2="175" y2="185" stroke="#0F172A" stroke-width="4"/>
    <line x1="285" y1="65" x2="285" y2="185" stroke="#0F172A" stroke-width="4"/>
    <line x1="395" y1="65" x2="395" y2="185" stroke="#0F172A" stroke-width="4"/>
    <line x1="515" y1="65" x2="515" y2="185" stroke="#0F172A" stroke-width="4"/>
    <line x1="635" y1="65" x2="635" y2="185" stroke="#0F172A" stroke-width="4"/>
    <line x1="750" y1="65" x2="750" y2="185" stroke="#0F172A" stroke-width="4"/>

    <!-- Modern Angled Window Sunlight Reflection -->
    <polygon points="120,65 185,65 130,185 80,185" fill="#FFFFFF" opacity="0.12"/>
    <polygon points="320,65 410,65 340,185 260,185" fill="#FFFFFF" opacity="0.12"/>
    <polygon points="560,65 660,65 590,185 500,185" fill="#FFFFFF" opacity="0.12"/>
    <polygon points="800,65 850,65 830,185 780,185" fill="#FFFFFF" opacity="0.12"/>

    <!-- Front Door & Middle Low-Floor Doors -->
    <!-- Front Entrance Door -->
    <rect x="755" y="75" width="95" height="195" rx="3" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="802" y1="75" x2="802" y2="270" stroke="#334155" stroke-width="2.5"/>
    <rect x="760" y="80" width="38" height="100" rx="3" fill="#1E293B" opacity="0.65"/>
    <rect x="807" y="80" width="38" height="100" rx="3" fill="#1E293B" opacity="0.65"/>
    <rect x="755" y="266" width="95" height="5" fill="#EAB308"/>

    <!-- Middle Extra-Wide Double Low-Floor Door -->
    <rect x="400" y="75" width="110" height="195" rx="3" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="455" y1="75" x2="455" y2="270" stroke="#334155" stroke-width="2.5"/>
    <rect x="405" y="80" width="45" height="100" rx="3" fill="#1E293B" opacity="0.65"/>
    <rect x="460" y="80" width="45" height="100" rx="3" fill="#1E293B" opacity="0.65"/>
    <rect x="400" y="266" width="110" height="5" fill="#EAB308"/>

    <!-- 大都會客運 (MTC) Signature Pure-Electric Green Energy Wave Livery -->
    <!-- Cyan/Blue Wave Base -->
    <path d="M 60 215 
             Q 340 198, 520 225 
             T 880 205 
             L 880 226 
             Q 680 242, 520 236 
             T 60 228 Z" 
          fill="url(#mtcBlueAccent)"/>

    <!-- Vibrant Emerald Green Wave (大都會客運綠能塗裝) -->
    <path d="M 60 228 
             Q 350 218, 530 240 
             T 940 218 
             L 940 245 
             Q 700 262, 530 252 
             T 60 246 Z" 
          fill="url(#mtcGreenWave)"/>

    <!-- Metro Red Line Tribute Speed Line (#E3002C) -->
    <path d="M 50 252 L 940 252 L 940 256 L 50 256 Z" fill="#E3002C" opacity="0.95"/>

    <!-- Front & Side Electronic Destination Display (LED 行先板) -->
    <!-- Side LED Sign: 262 德霖科大 ↔ 民生社區 -->
    <rect x="520" y="75" width="115" height="28" rx="3" fill="#000000" stroke="#1E293B" stroke-width="1.5"/>
    <text x="577" y="94" fill="#F59E0B" font-family="'Courier New', monospace, sans-serif" font-size="12.5" font-weight="900" text-anchor="middle" filter="url(#ledGlow262)">262 德霖-民生</text>

    <!-- Front Top LED Sign (Header) -->
    <rect x="862" y="60" width="75" height="36" rx="4" fill="#0A0A0A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="899" y="76" fill="#F59E0B" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" text-anchor="middle" filter="url(#ledGlow262)">262</text>
    <text x="899" y="90" fill="#22C55E" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">往 民生社區</text>

    <!-- Operator Branding & Logos (大都會客運) -->
    <g transform="translate(195, 204)">
      <!-- MTC Logo Circle -->
      <circle cx="10" cy="8" r="8" fill="#047857"/>
      <path d="M 6 11 L 10 4 L 14 11 Z" fill="#FFFFFF"/>
      <text x="24" y="14" fill="#0F172A" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="900" letter-spacing="1">大都會客運</text>
      <text x="110" y="13" fill="#64748B" font-family="'JetBrains Mono', sans-serif" font-size="10" font-weight="700">MTC BUS</text>
    </g>

    <!-- Route Badge on Body -->
    <g transform="translate(130, 202)">
      <rect x="0" y="-12" width="56" height="23" rx="4" fill="#E3002C"/>
      <text x="28" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle">262</text>
    </g>

    <!-- License Plate (Taiwan Electric Bus Plate: Green Header or Green Border EAL-0126) -->
    <g transform="translate(865, 252)">
      <rect x="0" y="0" width="68" height="22" rx="3" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
      <rect x="0" y="0" width="68" height="4" fill="#10B981"/>
      <text x="34" y="16" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">EAL-0126</text>
    </g>

    <!-- Accessibility & Electric Vehicle Icons -->
    <circle cx="730" cy="208" r="9" fill="#0284C7"/>
    <path d="M 727 203 A 2 2 0 1 1 731 203 A 2 2 0 1 1 727 203 M 729 206 L 729 211 L 733 211 M 729 208 L 733 208" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Green EV Plug Badge -->
    <circle cx="705" cy="208" r="9" fill="#10B981"/>
    <path d="M 702 206 L 705 204 L 705 212 L 708 210" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Front Projector LED Headlight Cluster -->
    <path d="M 935 245 L 945 248 C 948 260 946 272 938 278 L 928 278 Z" fill="#0F172A"/>
    <ellipse cx="940" cy="252" rx="5" ry="6" fill="#F8FAFC" stroke="#38BDF8" stroke-width="1.5" filter="url(#ledGlow262)"/>
    <circle cx="941" cy="265" r="3.5" fill="#F59E0B"/>
    <path d="M 938 250 L 970 240 L 970 265 Z" fill="#38BDF8" opacity="0.15"/>

    <!-- Tail lights (Left Rear) -->
    <rect x="49" y="240" width="5" height="14" rx="2" fill="#DC2626" filter="url(#ledGlow262)"/>
    <rect x="49" y="258" width="5" height="10" rx="2" fill="#EA580C"/>

    <!-- Front Rearview Mirror (Rabbit Ear) -->
    <path d="M 890 60 Q 950 38, 962 68 L 958 110 Q 952 112, 948 100 L 950 70 Z" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
    <rect x="950" y="68" width="14" height="44" rx="4" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="952" y="71" width="10" height="38" rx="2" fill="#94A3B8" opacity="0.8"/>

    <!-- Left Rearview Mirror -->
    <path d="M 845 75 Q 830 65, 820 85 L 825 95 Z" fill="#1E293B"/>

    <!-- WHEELS -->
    <!-- Rear Wheel -->
    <g transform="translate(225, 285)">
      <path d="M -65 0 A 65 65 0 0 1 65 0 Z" fill="#0F172A"/>
      <circle cx="0" cy="0" r="54" fill="url(#tireRubber)"/>
      <circle cx="0" cy="0" r="44" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
      <circle cx="0" cy="0" r="34" fill="url(#rimAlloy)" stroke="#64748B" stroke-width="1"/>
      <circle cx="0" cy="0" r="16" fill="#1E293B"/>
      <circle cx="0" cy="0" r="8" fill="#F8FAFC"/>
      <circle cx="0" cy="-24" r="3.5" fill="#334155"/>
      <circle cx="21" cy="-12" r="3.5" fill="#334155"/>
      <circle cx="21" cy="12" r="3.5" fill="#334155"/>
      <circle cx="0" cy="24" r="3.5" fill="#334155"/>
      <circle cx="-21" cy="12" r="3.5" fill="#334155"/>
      <circle cx="-21" cy="-12" r="3.5" fill="#334155"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(755, 285)">
      <path d="M -65 0 A 65 65 0 0 1 65 0 Z" fill="#0F172A"/>
      <circle cx="0" cy="0" r="54" fill="url(#tireRubber)"/>
      <circle cx="0" cy="0" r="44" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
      <circle cx="0" cy="0" r="34" fill="url(#rimAlloy)" stroke="#64748B" stroke-width="1"/>
      <circle cx="0" cy="0" r="16" fill="#1E293B"/>
      <circle cx="0" cy="0" r="8" fill="#F8FAFC"/>
      <circle cx="0" cy="-24" r="3.5" fill="#334155"/>
      <circle cx="21" cy="-12" r="3.5" fill="#334155"/>
      <circle cx="21" cy="12" r="3.5" fill="#334155"/>
      <circle cx="0" cy="24" r="3.5" fill="#334155"/>
      <circle cx="-21" cy="12" r="3.5" fill="#334155"/>
      <circle cx="-21" cy="-12" r="3.5" fill="#334155"/>
    </g>
  </g>
</svg>